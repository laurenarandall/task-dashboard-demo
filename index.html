<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Team list · Northwind Goods (design demo)</title>
<!-- Design demo. All tasks, people and figures are invented sample content. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--surface:#FFF;--surface-2:#FAFBFC;--surface-3:#F1F3F6;--border:#E6E8ED;--text:#0D1117;--text-2:#4A5262;--text-3:#8A919E;
--accent:#5B5BD6;--accent-soft:#EEEEFC;--late:#E5484D;--late-soft:#FEECEE;--today:#EF6C12;--today-soft:#FFF1E6;
--quiz:#8E4EC6;--quiz-soft:#F4ECFB;--decision:#D18A00;--decision-soft:#FDF4DE;--project:#0B7FE0;--project-soft:#E6F2FD;
--evidence:#0E9888;--evidence-soft:#E2F5F2;--action:#64708A;--action-soft:#EEF0F4;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0A0B0E;--surface:#111216;--surface-2:#15161B;--surface-3:#1B1D23;--border:#22252D;--text:#ECEEF2;--text-2:#A5ABB7;--text-3:#6E7582;
--accent:#7C7CF0;--accent-soft:#1E1E3A;--late:#FF6369;--late-soft:#2E1517;--today:#FF8B3E;--today-soft:#2E1C10;
--quiz:#B78AF0;--quiz-soft:#24183A;--decision:#F5C04A;--decision-soft:#2B2210;--project:#52A9FF;--project-soft:#0F2236;
--evidence:#33D1BD;--evidence-soft:#0D2723;--action:#98A2B8;--action-soft:#1C1F27;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--quiz));display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
header h1{font-size:22px;font-weight:750;letter-spacing:-.02em}
header .sub{font-size:13px;color:var(--text-3);margin-top:1px}
.demo{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:999px;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:750;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--text-3)}
.stat.late b{color:var(--late)}.stat.today b{color:var(--today)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-3);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{padding:8px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:550;color:var(--text-2)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{border-color:currentColor;background:var(--c-soft);color:var(--c)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.gh{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:12px 14px 6px;background:var(--surface-2)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--border);width:100%;text-align:left}
.row:active{background:var(--surface-3)}
.tico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--c-soft);color:var(--c)}
.tico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt{flex:1;min-width:0}
.rt .t{font-size:14.5px;font-weight:550;line-height:1.35;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--text-3)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--text-3)}
.tag{font-weight:600;color:var(--c)}
.due.late{color:var(--late);font-weight:600}.due.today{color:var(--today);font-weight:600}
.flag{color:var(--late);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--text-3);font-size:14px}
.t-quiz{--c:var(--quiz);--c-soft:var(--quiz-soft)}.t-decision{--c:var(--decision);--c-soft:var(--decision-soft)}
.t-project{--c:var(--project);--c-soft:var(--project-soft)}.t-evidence{--c:var(--evidence);--c-soft:var(--evidence-soft)}
.t-action{--c:var(--action);--c-soft:var(--action-soft)}.t-all{--c:var(--accent);--c-soft:var(--accent-soft)}
.add{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border)}
.add form{max-width:528px;margin:0 auto;display:flex;gap:8px}
.add input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font-size:16px;outline:none}
.add input:focus{border-color:var(--accent)}
.add button{height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:650}
/* sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sh-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.sh-top .x{width:36px;height:36px;border-radius:10px;background:var(--surface-3);font-size:18px;flex:none}
.sh-top .id{font-size:12px;color:var(--text-3);font-weight:600}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px calc(env(safe-area-inset-bottom) + 28px)}
.sh-body>*{max-width:560px;margin-left:auto;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--c-soft);color:var(--c)}
h2{font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1.25;margin:10px 0 8px}
.note{color:var(--text-2);line-height:1.55;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:14px;box-shadow:var(--shadow)}
.card h3{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center}
.card h3 small{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--c)}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.q{padding:12px 0;border-top:1px solid var(--border)}.q:first-of-type{border-top:0;padding-top:0}
.q p{font-weight:600;font-size:14.5px;line-height:1.4;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:11px;border:1px solid var(--border);margin-top:6px;font-size:14px;background:var(--surface-2)}
.opt.on{border-color:var(--c);background:var(--c-soft);color:var(--c);font-weight:600}
.dopt{display:block;width:100%;text-align:left;padding:13px;border-radius:14px;border:1.5px solid var(--border);margin-top:10px;background:var(--surface-2)}
.dopt b{font-size:14.5px}.dopt p{font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.45}
.dopt .rec{font-size:11px;font-weight:700;color:var(--c);margin-left:6px}
.dopt.on{border-color:var(--c);background:var(--c-soft)}
.sub{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--border);font-size:14px}
.sub:first-of-type{border-top:0}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
.sub.done .box{background:var(--c);border-color:var(--c)}.sub.done span.l{color:var(--text-3);text-decoration:line-through}
.sub small{margin-left:auto;color:var(--text-3);font-size:12px;white-space:nowrap}
.doc{display:flex;gap:10px;align-items:flex-start}
.doc .di{width:34px;height:40px;border-radius:7px;background:var(--c-soft);color:var(--c);font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}
.doc b{font-size:14px;display:block}.doc p{font-size:13px;color:var(--text-2);margin-top:3px;line-height:1.45}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text-3)}
.chart i{width:100%;border-radius:6px 6px 2px 2px;background:var(--c);opacity:.85}
.mainbtn{display:block;width:100%;margin-top:16px;height:48px;border-radius:14px;background:var(--c,var(--accent));color:#fff;font-weight:700;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style></head><body>
<div class="wrap">
 <header><div class="logo">N</div><div><h1>Team list</h1><div class="sub" id="date"></div></div><span class="demo">Sample data</span></header>
 <div class="stats" id="stats"></div>
 <div class="seg" id="seg"><button data-v="today">Today</button><button data-v="late">Late</button><button data-v="all">All</button></div>
 <div class="chips" id="chips"></div>
 <div class="list" id="list"></div>
</div>
<div class="add"><form id="addf"><input id="addi" placeholder="Add a task…  end with ! for urgent" autocomplete="off" enterkeyhint="done"><button>Add</button></form></div>
<section class="sheet" id="sheet"><div class="sh-top"><button class="x" id="close" aria-label="Close">✕</button><span class="id" id="shid"></span></div><div class="sh-body" id="shb"></div></section>
<div class="toast" id="toast"></div>
<script>
/* All content below is invented sample data for a fictional company, Northwind Goods. */
var IC={quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/>',
decision:'<path d="M6 3v6a6 6 0 0 0 6 6h6M15 12l3 3-3 3M6 21v-4"/>',
project:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h3M8 16h6"/>',
evidence:'<path d="M3 3v18h18"/><path d="M7 15v2M11 11v6M15 7v10M19 12v5"/>',
action:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'};
var TN={quiz:'Quiz',decision:'Decision',project:'Project',evidence:'Evidence',action:'Action'};
function ico(t){return '<span class="tico t-'+t+'"><svg viewBox="0 0 24 24">'+IC[t]+'</svg></span>'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var TASKS=[
 {id:'NW-101',g:'late',type:'quiz',title:'Answer the supplier onboarding questions',due:'3d late',urgent:1,
  note:'Four questions about the new glaze supplier: lead times, minimum orders and who signs the agreement. Two are already answered.',
  quiz:[{q:'Who signs the supplier agreement?',o:['Alex (ops lead)','Priya (finance)','Both of us'],a:0},
        {q:'What minimum order are we comfortable with?',o:['200 units','500 units','1,000 units'],a:null},
        {q:'Should samples ship before the contract is signed?',o:['Yes — ask for them now','No — wait for signature'],a:null},
        {q:'Which warehouse receives the first delivery?',o:['East dock','West dock','Split 50/50'],a:1}]},
 {id:'NW-102',g:'late',type:'decision',title:'Ship holiday orders from one warehouse or two?',due:'2d late',urgent:1,
  note:'Holiday volume is forecast at about 3× October. One site is simpler; two sites are faster for west-coast customers.',
  opts:[{k:'A',t:'One warehouse',p:'Simplest to run. West-coast delivery averages 5 days.'},
        {k:'B',t:'Two warehouses',p:'Fastest delivery everywhere, but stock has to be split and tracked twice.'},
        {k:'C',t:'Two warehouses for best-sellers only',p:'Top 20 products ship from both; everything else from one.',rec:1}]},
 {id:'NW-103',g:'late',type:'evidence',title:'Return rate on the stoneware mugs doubled in October',due:'1d late',
  note:'Most returns say "arrived chipped". The packaging changed on Oct 3, which lines up with the jump.',
  doc:{name:'Returns by week — mugs.csv',kind:'CSV',sum:'Pulled from the order system. Returns were steady at 2–3% until the week of Oct 3, then rose to 6%. 71% of October returns cite damage in transit.'},
  chart:[['Sep 12',2.4],['Sep 19',2.1],['Sep 26',2.8],['Oct 3',4.9],['Oct 10',6.2],['Oct 17',5.8]]},
 {id:'NW-104',g:'late',type:'action',title:'Renew the shipping insurance policy',due:'4d late',note:'The current policy lapses at the end of the month. The broker sent the renewal form on Nov 2.'},
 {id:'NW-105',g:'late',type:'quiz',title:'Which sales channels need a holiday price?',due:'5d late',note:'Marketing needs a yes or no for each channel before the campaign artwork is final.'},
 {id:'NW-106',g:'today',type:'project',title:'Launch the new linen collection',due:'Today',urgent:1,
  note:'Twelve products, photography done. What is left is listings, stock counts and the launch email.',
  subs:[['Final product photos',1,'Marcus'],['Write the 12 product descriptions',1,'Dana'],['Set prices and bundles',1,'Priya'],['Count opening stock',0,'Alex'],['Create store listings',0,'Dana'],['Schedule the launch email',0,'Marcus'],['Go-live check',0,'Alex']]},
 {id:'NW-107',g:'today',type:'action',title:'Reply to the wholesale enquiry from a gift shop chain',due:'Today',note:'They asked for a line sheet and minimums. The line sheet is in the shared drive.'},
 {id:'NW-108',g:'today',type:'decision',title:'Approve the new box size for candles',due:'Today',note:'The smaller box saves about $0.40 per order in postage but fits one fewer candle.'},
 {id:'NW-109',g:'today',type:'evidence',title:'Check last month’s ad spend against sales',due:'Today',note:'A quick read of which campaigns paid for themselves.'},
 {id:'NW-110',g:'today',type:'quiz',title:'Confirm the gift-wrap options for December',due:'Today',note:'Three questions from the packing team about paper, ribbon and cut-off dates.'},
 {id:'NW-111',g:'week',type:'action',title:'Book the photographer for spring catalog',due:'Thu',note:'Two dates offered: Nov 19 or Nov 24.'},
 {id:'NW-112',g:'week',type:'project',title:'Move product images to the new storage folder',due:'Fri',note:'About 900 images; naming convention agreed last week.'},
 {id:'NW-113',g:'week',type:'decision',title:'Keep free shipping at $50 or raise it to $65?',due:'Mon',note:'Average order is $58. Raising the threshold may lift order size or lose orders.'},
 {id:'NW-114',g:'week',type:'action',title:'Update the returns page with holiday dates',due:'Tue',note:'Extended returns: anything bought Nov 15 – Dec 24 can be returned until Jan 31.'},
 {id:'NW-115',g:'week',type:'evidence',title:'Compare three courier quotes for 2027',due:'Wed',note:'Quotes are in; the cheapest is not the fastest.'},
 {id:'NW-116',g:'week',type:'quiz',title:'Year-end stock count: answer the setup questions',due:'Thu',note:'Date, who counts, and whether the store stays open.'}
];
var S={seg:'today',type:null};
try{var sv=JSON.parse(localStorage.getItem('nw-phone')||'null');if(sv&&sv.seg)S.seg=sv.seg}catch(e){}
function save(){try{localStorage.setItem('nw-phone',JSON.stringify({seg:S.seg}))}catch(e){}}
var $=function(s){return document.querySelector(s)};
$('#date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · Northwind Goods';
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},1800)}
function open(){return TASKS.filter(function(t){return !t.done})}
function render(){
 var o=open(),c=function(g){return o.filter(function(t){return t.g===g}).length};
 $('#stats').innerHTML=[['late',c('late'),'Late'],['today',c('today'),'Due today'],['',o.length,'Open'],['',o.filter(function(t){return t.urgent}).length,'Urgent']]
  .map(function(s){return '<div class="stat '+s[0]+'"><b>'+s[1]+'</b><span>'+s[2]+'</span></div>'}).join('');
 document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.seg)});
 var types=['quiz','decision','project','evidence','action'];
 $('#chips').innerHTML='<button class="chip t-all '+(S.type?'':'on')+'" data-t="">All types</button>'+types.map(function(t){
  var n=TASKS.filter(function(x){return x.type===t&&!x.done}).length;
  return '<button class="chip t-'+t+' '+(S.type===t?'on':'')+'" data-t="'+t+'"><i style="background:var(--c)"></i>'+TN[t]+' '+n+'</button>'}).join('');
 var vis=TASKS.filter(function(t){return (S.seg==='all'||t.g===S.seg)&&(!S.type||t.type===S.type)});
 var groups=S.seg==='all'?[['late','Late'],['today','Today'],['week','This week']]:[[S.seg,S.seg==='late'?'Late':'Today']];
 var h='';groups.forEach(function(g){var rows=vis.filter(function(t){return t.g===g[0]});if(!rows.length)return;
  h+='<div class="gh">'+g[1]+' · '+rows.length+'</div>'+rows.map(function(t){
   return '<button class="row '+(t.done?'done':'')+'" data-id="'+t.id+'">'+ico(t.type)+'<div class="rt"><div class="t">'+esc(t.title)+'</div><div class="meta t-'+t.type+'"><span class="tag">'+TN[t.type]+'</span><span>·</span><span class="due '+t.g+'">'+esc(t.due)+'</span>'+(t.urgent?'<span class="flag">⚑ Urgent</span>':'')+'</div></div></button>'}).join('')});
 $('#list').innerHTML=h||'<div class="empty">Nothing here. Nice.</div>';
}
function body(t){
 var h='<div class="t-'+t.type+'"><span class="pill">'+TN[t.type]+'</span> <span class="pill t-action">'+esc(t.due)+'</span>'+(t.urgent?' <span class="pill" style="--c:var(--late);--c-soft:var(--late-soft)">⚑ Urgent</span>':'')+
  '<h2>'+esc(t.title)+'</h2><p class="note">'+esc(t.note)+'</p>';
 if(t.quiz){var d=t.quiz.filter(function(q){return q.a!=null}).length;
  h+='<div class="card"><h3>Questions<small>'+d+' of '+t.quiz.length+' answered</small></h3><div class="bar"><i style="width:'+(100*d/t.quiz.length)+'%"></i></div>'+
   t.quiz.map(function(q,qi){return '<div class="q"><p>'+(qi+1)+'. '+esc(q.q)+'</p>'+q.o.map(function(o,oi){return '<button class="opt '+(q.a===oi?'on':'')+'" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>'}).join('')+'</div>'}).join('')+'</div>';}
 else if(t.opts){h+='<div class="card"><h3>Options<small>'+(t.pick?'Option '+t.pick+' chosen':'Pick one')+'</small></h3>'+
   t.opts.map(function(o){return '<button class="dopt '+(t.pick===o.k?'on':'')+'" data-k="'+o.k+'"><b>'+o.k+' · '+esc(o.t)+'</b>'+(o.rec?'<span class="rec">✦ Suggested</span>':'')+'<p>'+esc(o.p)+'</p></button>'}).join('')+'</div>';}
 else if(t.subs){var n=t.subs.filter(function(s){return s[1]}).length;
  h+='<div class="card"><h3>Plan<small>'+n+' of '+t.subs.length+' done</small></h3><div class="bar"><i style="width:'+(100*n/t.subs.length)+'%"></i></div>'+
   t.subs.map(function(s,i){return '<button class="sub '+(s[1]?'done':'')+'" data-s="'+i+'"><span class="box">'+(s[1]?'✓':'')+'</span><span class="l">'+esc(s[0])+'</span><small>'+esc(s[2])+'</small></button>'}).join('')+'</div>';}
 else if(t.doc){var mx=Math.max.apply(null,t.chart.map(function(c){return c[1]}));
  h+='<div class="card"><h3>Evidence</h3><div class="doc"><span class="di">'+t.doc.kind+'</span><div><b>'+esc(t.doc.name)+'</b><p>'+esc(t.doc.sum)+'</p></div></div></div>'+
   '<div class="card"><h3>Return rate by week<small>%</small></h3><div class="chart">'+t.chart.map(function(c){return '<div><span>'+c[1]+'</span><i style="height:'+(85*c[1]/mx)+'px"></i>'+c[0]+'</div>'}).join('')+'</div></div>';}
 h+='<button class="mainbtn" id="done">'+(t.done?'Reopen task':'Mark done')+'</button></div>';
 return h;
}
var cur=null;
function openSheet(id){cur=TASKS.filter(function(t){return t.id===id})[0];if(!cur)return;$('#shid').textContent=cur.id;$('#shb').innerHTML=body(cur);$('#sheet').classList.add('on');$('#shb').scrollTop=0}
function rerender(){var st=$('#shb').scrollTop;$('#shb').innerHTML=body(cur);$('#shb').scrollTop=st}
$('#list').addEventListener('click',function(e){var r=e.target.closest('.row');if(r)openSheet(r.dataset.id)});
$('#close').onclick=function(){$('#sheet').classList.remove('on');render()};
$('#shb').addEventListener('click',function(e){var b;
 if(b=e.target.closest('.opt')){cur.quiz[+b.dataset.q].a=+b.dataset.o;rerender()}
 else if(b=e.target.closest('.dopt')){cur.pick=b.dataset.k;rerender();toast('Option '+cur.pick+' recorded')}
 else if(b=e.target.closest('.sub')){var s=cur.subs[+b.dataset.s];s[1]=s[1]?0:1;rerender()}
 else if(e.target.id==='done'){cur.done=!cur.done;$('#sheet').classList.remove('on');render();toast(cur.done?'Done ✓':'Reopened')}});
$('#seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.seg=b.dataset.v;save();render()});
$('#chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;S.type=b.dataset.t||null;render()});
$('#addf').addEventListener('submit',function(e){e.preventDefault();var v=$('#addi').value.trim();if(!v)return;
 var urg=/!\s*$/.test(v);v=v.replace(/!\s*$/,'').trim();
 TASKS.push({id:'NW-'+(101+TASKS.length),g:'today',type:'action',title:v,due:'Today',urgent:urg?1:0,note:'Added from your phone.'});
 $('#addi').value='';$('#addi').blur();if(S.seg==='late')S.seg='today';render();toast('Added to Today')});
render();
</script></body></html>
